# Development / Demo Nginx configuration
# Permissive CORS, dynamic DNS resolver for container networking

server_tokens off;

server {
    listen       8080;
    server_name  _;

    # Dynamic DNS resolver for container hostnames
    resolver 127.0.0.11 valid=10s ipv6=off;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Permissive CORS (dev only) ---
    add_header Access-Control-Allow-Origin  "*"  always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, traceparent, tracestate" always;

    # Handle preflight
    location @cors_preflight {
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, traceparent, tracestate";
        add_header Access-Control-Max-Age       86400;
        add_header Content-Length               0;
        return 204;
    }

    # --- Static Assets ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Reverse Proxy: API → Backend ---
    location /items {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        set $backend_upstream backend:8000;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # W3C Trace Context propagation
        proxy_set_header   traceparent       $http_traceparent;
        proxy_set_header   tracestate        $http_tracestate;
    }

    # --- Reverse Proxy: OTel → Alloy Collector ---
    location /v1/ {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        set $alloy_upstream alloy:4318;
        proxy_pass         http://$alloy_upstream/v1/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Content-Type      $http_content_type;
    }

    # --- Health check ---
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
