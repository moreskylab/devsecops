<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevSecOps Item Manager — A cloud-native CRUD app with full OpenTelemetry observability"
    />
    <title>DevSecOps Item Manager</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>📦 Item Manager</h1>
        <p class="subtitle">DevSecOps Demo — Full-Stack Observability</p>
      </header>

      <main>
        <!-- Create / Edit Form -->
        <section id="form-section">
          <form id="item-form">
            <input type="hidden" id="item-id" />
            <div class="form-group">
              <label for="item-title">Title</label>
              <input
                type="text"
                id="item-title"
                name="title"
                placeholder="Enter item title…"
                required
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label for="item-description">Description</label>
              <textarea
                id="item-description"
                name="description"
                placeholder="Enter item description (optional)…"
                rows="3"
              ></textarea>
            </div>
            <div class="form-actions">
              <button type="submit" id="btn-submit">Create Item</button>
              <button type="button" id="btn-cancel" class="secondary" hidden>
                Cancel
              </button>
            </div>
          </form>
        </section>

        <!-- Item List -->
        <section id="list-section">
          <h2>Items</h2>
          <div id="item-list" role="list" aria-label="Item list"></div>
          <p id="empty-state" class="empty" hidden>
            No items yet. Create one above!
          </p>
        </section>
      </main>

      <footer>
        <p>
          Instrumented with
          <a
            href="https://opentelemetry.io"
            target="_blank"
            rel="noopener noreferrer"
            >OpenTelemetry</a
          >
          ·
          <a
            href="https://grafana.com"
            target="_blank"
            rel="noopener noreferrer"
            >Grafana Stack</a
          >
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
